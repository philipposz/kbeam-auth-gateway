services:
  auth-gateway:
    build: .
    env_file:
      - .env
    environment:
      KBEAM_AUTH_BIND: 0.0.0.0:18090
    ports:
      - "127.0.0.1:18090:18090"
    volumes:
      - auth-gateway-var:/app/var
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.parse, urllib.request; from kbeam_auth_gateway.config import normalize_host_authority, normalize_public_origin; trusted=next((item.strip() for item in os.environ.get('KBEAM_AUTH_TRUSTED_HOSTS','').split(',') if item.strip()),''); host=normalize_host_authority(trusted) if trusted else urllib.parse.urlparse(normalize_public_origin(os.environ.get('KBEAM_AUTH_PUBLIC_BASE_URL','https://auth.example.com'))).netloc; request=urllib.request.Request('http://127.0.0.1:18090/ready', headers={'Host':host}); urllib.request.urlopen(request, timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  auth-gateway-var:
